<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Event Media Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #38ef7d;
            --accent-dark: #11998e;
            --bg: #080f1a;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.09);
            --text: #f1f5f9;
            --muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow-y: auto; padding: 40px 20px;
        }
        /* Animated background */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(17,153,142,0.18) 0%, transparent 60%),
                        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(56,239,125,0.10) 0%, transparent 55%);
            pointer-events: none;
        }
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: block;
        }
        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 2em;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            color: var(--text);
        }
        .subtitle { color: var(--muted); font-size: 0.9em; margin-bottom: 36px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.82em; font-weight: 500; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { border-color: var(--accent-dark); box-shadow: 0 0 0 3px rgba(17,153,142,0.2); }
        input::placeholder { color: #334155; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            border: none;
            border-radius: 10px;
            color: #001a0e;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 6px 20px rgba(56,239,125,0.3);
            margin-top: 8px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(56,239,125,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 12px 16px; border-radius: 8px; font-size: 0.88em; margin-bottom: 18px; display: none; }
        .link { display: block; text-align: center; margin-top: 24px; color: var(--muted); text-decoration: none; font-size: 0.9em; transition: color 0.2s; }
        .link:hover { color: var(--text); }
        .link span { color: var(--accent); font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <span class="logo">EMP</span>
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="login-btn">Sign In</button>
        </form>

        <a href="register.html" class="link">Don't have an account? <span>Register here</span></a>
    </div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem("access_token")) window.location.href = "index.html";

        const API = "http://127.0.0.1:8000";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('error-msg');
            errBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('login-email').value.trim());
            formData.append('password', document.getElementById('login-password').value);

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_role', data.role);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('user_name', data.name);
                    window.location.href = 'index.html';
                } else {
                    errBox.textContent = data.detail || 'Invalid email or password.';
                    errBox.style.display = 'block';
                }
            } catch {
                errBox.textContent = 'Could not connect to server. Is the backend running?';
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
